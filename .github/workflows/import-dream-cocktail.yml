name: Import Dream cocktail artwork
on:
  push:
    paths:
      - '.github/workflows/import-dream-cocktail.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Photoshop-exported WebP
        env:
          SOURCE_URL: "https://uc6b4f1598956744f71f08035ee4.dl.dropboxusercontent.com/cd/0/get/DMcvTrbJizVz4bkduXV8Z89FqY7QjaPsVFAgZaTQU68ZNcST6Im4AcRM9y638eLFeDpqnaeiy8R_9ChLKzPfKXtf35B6d464dCw9rQwI4JVZXxv6IqvjsuZl-YYhob5d8W6xOoT__OIQcuMN9Ua30Ef1ad_8bZs--_wVWbjyK-mCbg/file?c_luid=c95dc5f1"
        run: |
          mkdir -p public/branding
          curl --fail --location --silent --show-error --retry 1 --max-time 60 "$SOURCE_URL" -o public/branding/dream-3d.webp
          test "$(wc -c < public/branding/dream-3d.webp | tr -d ' ')" = "179872"
          echo 'f0335a29344f7b3b2a0e1cc2decd5216c6b35a6183fec5700addecd0b37019a2  public/branding/dream-3d.webp' | sha256sum --check
      - name: Commit image asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/branding/dream-3d.webp
          git commit -m "Add exact 512px Photoshop Dream WebP artwork"
          git push
